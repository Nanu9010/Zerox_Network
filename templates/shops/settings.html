{% extends 'base.html' %}

{% block title %}Shop Settings - Zerox{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto; padding: 0 1rem;">
    
    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
        <a href="{% url 'shops:dashboard' %}" style="display: inline-flex; align-items: center; padding: 0.5rem 1rem; background: var(--bg-surface); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-family: var(--font-heading); font-weight: 700; font-size: 0.875rem; border-radius: 0; transition: translateY -1px; cursor: pointer;">← Back</a>
        <h1 style="margin: 0; font-family: var(--font-heading); font-weight: 800; color: var(--ink); font-size: 1.75rem;">Shop Settings</h1>
    </div>

    <div style="background: var(--bg-surface); border: 1px solid var(--line); border-radius: 0; padding: 2rem;">
        <h3 style="margin: 0 0 0.5rem; font-family: var(--font-heading); font-weight: 800; color: var(--ink); font-size: 1.25rem;">Operating Hours</h3>
        <p style="margin: 0 0 1.5rem; font-family: var(--font-body); color: var(--mid); font-size: 0.9375rem; line-height: 1.5;">Set your shop's opening and closing times. During closed hours, your shop will appear as "CLOSED" to customers.</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                    <label style="font-family: var(--font-heading); font-weight: 700; font-size: 0.8125rem; color: var(--ink); text-transform: uppercase; letter-spacing: 0.05em;">Opening Time</label>
                    <input type="time" name="opening_time" value="{{ shop.opening_time|time:'H:i' }}" style="padding: 0.625rem 0.75rem; border: 1px solid var(--line); border-radius: 0; background: var(--bone); color: var(--ink); font-family: var(--font-body); font-size: 0.9375rem; outline: none;">
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                    <label style="font-family: var(--font-heading); font-weight: 700; font-size: 0.8125rem; color: var(--ink); text-transform: uppercase; letter-spacing: 0.05em;">Closing Time</label>
                    <input type="time" name="closing_time" value="{{ shop.closing_time|time:'H:i' }}" style="padding: 0.625rem 0.75rem; border: 1px solid var(--line); border-radius: 0; background: var(--bone); color: var(--ink); font-family: var(--font-body); font-size: 0.9375rem; outline: none;">
                </div>
            </div>
            
            <button type="submit" style="margin-top: 1.25rem; padding: 0.625rem 1.5rem; background: var(--ink); color: var(--bone); border: 1px solid var(--ink); border-radius: 0; font-family: var(--font-heading); font-weight: 700; font-size: 0.875rem; cursor: pointer; transition: transform 0.15s ease;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">Save Settings</button>
        </form>
    </div>
</div>
{% endblock %}
