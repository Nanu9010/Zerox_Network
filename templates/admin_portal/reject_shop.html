{% extends 'base.html' %}

{% block title %}Reject Shop - Admin{% endblock %}

{% block extra_css %}
<style>
    :root {
        --bone: #EFEDE8;
        --ink: #101010;
        --mid: #8A8781;
        --bg-surface: #F4F3EF;
        --line: #E2E0DA;
        --error: #C43D3D;
        --font-heading: 'Archivo', sans-serif;
        --font-body: 'Archivo', sans-serif;
    }
    .sable-section {
        background: var(--bg-surface);
        padding: 2rem 0;
    }
    .sable-container {
        max-width: 600px;
        margin: 0 auto;
    }
    .sable-card {
        background: var(--bone);
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 2rem;
    }
    .sable-heading {
        font-family: var(--font-heading);
        font-weight: 800;
        color: var(--ink);
        font-size: 1.75rem;
        margin: 0;
    }
    .sable-title {
        font-family: var(--font-heading);
        font-weight: 800;
        color: var(--ink);
        margin-bottom: 1rem;
    }
    .sable-subtitle {
        font-family: var(--font-body);
        color: var(--mid);
        margin-bottom: 2rem;
    }
    .sable-btn {
        font-family: var(--font-body);
        font-weight: 600;
        border-radius: 0;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--bone);
        padding: 0.75rem 1.5rem;
        cursor: pointer;
        transition: transform 0.15s ease;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 0.9rem;
    }
    .sable-btn:hover {
        transform: translateY(-1px);
    }
    .sable-btn-secondary {
        background: transparent;
        color: var(--ink);
    }
    .sable-btn-danger {
        background: transparent;
        border: 1px solid var(--error);
        color: var(--error);
    }
    .sable-form-label {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--ink);
        margin-bottom: 0.5rem;
        display: block;
    }
    .sable-form-input {
        font-family: var(--font-body);
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--bone);
        color: var(--ink);
        font-size: 0.9rem;
        box-sizing: border-box;
        resize: vertical;
    }
    .sable-form-input::placeholder {
        color: var(--mid);
    }
    .sable-form-group {
        margin-bottom: 1.25rem;
    }
    .sable-btn-group {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<section class="sable-section">
    <div class="container">
        <h1 class="sable-heading">Reject Shop</h1>
    </div>
</section>

<section class="container" style="padding: 3rem 0;">
    <div class="sable-container">
        <div class="sable-card">
            <h3 class="sable-title">Rejecting: {{ shop.name }}</h3>
            <p class="sable-subtitle">Please provide a reason for rejection</p>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="sable-form-group">
                    <label class="sable-form-label">Rejection Reason *</label>
                    <textarea name="reason" class="sable-form-input" rows="5" placeholder="Explain why this shop is being rejected..." required></textarea>
                </div>
                
                <div class="sable-btn-group">
                    <button type="submit" class="sable-btn sable-btn-danger" style="width: 100%;">
                        Confirm Rejection
                    </button>
                    <a href="{% url 'admin_portal:shop_approvals' %}" class="sable-btn sable-btn-secondary" style="width: 100%;">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
