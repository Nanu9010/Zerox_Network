{% extends 'base.html' %}

{% block title %}Login - Zerox{% endblock %}

{% block content %}
<section style="padding: clamp(40px, 7vh, 86px) 0; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 420px; width: 100%;">

        <div style="text-align: center; margin-bottom: 2.5rem;">
            <p class="rv-text" style="font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mid); margin-bottom: 0.5rem;">Welcome Back</p>
            <h1 class="rv-blur" style="font-size: clamp(32px, 5vw, 48px); font-weight: 800; line-height: 0.9; letter-spacing: -0.03em;">Sign In</h1>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="rv-scale" style="margin-bottom: 1.5rem; padding: 1rem; border-left: 3px solid {% if message.tags == 'success' %}var(--ink){% else %}var(--error){% endif %}; background: var(--bg-subtle); font-size: 0.875rem;">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="rv-left rv-d1">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary magnetic" style="width: 100%; padding: 1rem; margin-top: 1rem;">
                <span>Sign In</span>
            </button>
        </form>

        <div class="rv-text rv-d2" style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--line);">
            <p style="color: var(--mid); font-size: 13px;">
                Don't have an account?
                <a href="{% url 'core:signup' %}" style="color: var(--ink); font-weight: 600;">Sign up</a>
            </p>
        </div>

    </div>
</section>
{% endblock %}
